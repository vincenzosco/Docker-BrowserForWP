# A working deployment, with the two things that are easy to get wrong done
# properly: where the registry lives, and where the certificate comes from.
#
# The certificate is mounted read-only from ./tls and must be a real one. The
# phone validates the chain and the name before it sends a byte, so a self-signed
# certificate is not a shortcut -- it is a wall. See docs/DEPLOY.md.

services:
  render:
    build:
      context: .
      args:
        # Keep in step with the `playwright` range in package.json.
        PLAYWRIGHT_TAG: ${PLAYWRIGHT_TAG:-v1.49.1-jammy}
        WITH_AUDIO: ${WITH_AUDIO:-0}
    image: browserforwp-render:dev
    restart: unless-stopped
    ports:
      - "${BFWP_BIND_IP:-0.0.0.0}:8443:8443"
      # Uncomment together with BFWP_AUDIO_ENABLED=1 below.
      # - "${BFWP_BIND_IP:-0.0.0.0}:8444:8444"
      #
      # The registration page is NOT published here, and that is the default this
      # feature is built around: it listens on the container's loopback, so the
      # operator reaches it through an SSH tunnel (`ssh -L 8445:127.0.0.1:8445`)
      # and nobody else can. Publishing it takes two decisions, not one -- the
      # line below AND BFWP_REGISTER_HOST=0.0.0.0 AND BFWP_REGISTER_SECRET, because
      # src/config.js refuses a network-reachable page with no access code. A page
      # that mints credentials must not be one mistyped variable away.
      #
      # - "${BFWP_BIND_IP:-0.0.0.0}:8445:8445"
    environment:
      BFWP_PORT: "8443"
      BFWP_PUBLIC_URL: "${BFWP_PUBLIC_URL:?set BFWP_PUBLIC_URL to the https url phones use}"
      BFWP_SERVER_NAME: "${BFWP_SERVER_NAME:-BrowserForWP render server}"
      BFWP_DEVICES_FILE: /var/lib/bfwp/devices.json
      BFWP_TLS_CERT: /etc/bfwp/tls/fullchain.pem
      BFWP_TLS_KEY: /etc/bfwp/tls/privkey.pem
      BFWP_LOG_LEVEL: "${BFWP_LOG_LEVEL:-info}"
      BFWP_MAX_SESSIONS: "${BFWP_MAX_SESSIONS:-16}"
      BFWP_FRAME_QUALITY: "${BFWP_FRAME_QUALITY:-60}"
      # Audio is off by default and needs WITH_AUDIO=1 as well; the FIFO has to
      # be fed by the PulseAudio capture described in docs/DEPLOY.md.
      BFWP_AUDIO_ENABLED: "${BFWP_AUDIO_ENABLED:-0}"
      BFWP_AUDIO_FIFO: /run/bfwp/audio.mp3
      # The page where a phone's owner asks for a token. Loopback by default;
      # see the ports block above for what publishing it costs.
      BFWP_REGISTER_PORT: "${BFWP_REGISTER_PORT:-8445}"
      BFWP_REGISTER_HOST: "${BFWP_REGISTER_HOST:-127.0.0.1}"
      BFWP_REGISTER_SECRET: "${BFWP_REGISTER_SECRET:-}"
      BFWP_REGISTER_PER_HOUR: "${BFWP_REGISTER_PER_HOUR:-3}"
    volumes:
      - ./tls:/etc/bfwp/tls:ro
      - devices:/var/lib/bfwp
      # An `audio:/run/bfwp` volume sat here, and Compose refused the ENTIRE file
      # for it: "target /run/bfwp already mounted as services.render.tmpfs[1]".
      # A named volume and a tmpfs cannot share a target, and the tmpfs is the one
      # that is load-bearing -- `read_only: true` means the FIFO has nowhere else
      # to live, and a 64 MB cap on a file ffmpeg appends to is a cap worth having.
      # Nothing is lost by dropping the volume: the writer (ffmpeg, step 4 of
      # docs/DEPLOY.md) and the reader (`fs.createReadStream` in src/audio.js)
      # both run INSIDE this container, so a named volume would only persist a
      # growing mp3 across restarts. Found on Compose v5.5.1, the first run that
      # ever built this image.
    # The process draws pages for strangers. It should hold nothing it does not
    # need, and it should not be able to write to its own code.
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /run/bfwp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ...and three back, which is the whole set a privilege-dropping entrypoint
    # needs and no more:
    #
    #   SETUID, SETGID  so it can become pwuser at all -- `setpriv: setresuid
    #                   failed: Operation not permitted` on every start without them
    #   CHOWN           so it can hand the staged copy of the key to pwuser --
    #                   `chown: changing ownership ...: Operation not permitted`
    #
    # Both failures were measured on the first deployment, one restart apart. The
    # capabilities belong to the ENTRYPOINT's process for the few milliseconds
    # before it execs, and the kernel clears the permitted and effective sets when a
    # process moves from uid 0 to a non-zero uid, so the server that ends up serving
    # pages holds none of them.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # Chromium in a container needs more than the default 64 MB of /dev/shm, and
    # running out of it is the classic "the browser dies for no reason".
    shm_size: 1gb
    # A remote-rendering server holds a page's session state in memory. This
    # number is the ceiling on how much of the host one fleet of phones can
    # occupy, and it should be raised only with the host's memory.
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  devices:
